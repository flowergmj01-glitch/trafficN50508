                          ${currentPage === totalPages ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-blue-500 text-white hover:bg-blue-600 hover:scale-105 shadow-md'}`}
                  >
                      下一頁 ➡️
                  </button>
              </div>
              
              <p className="mt-6 text-gray-400 font-bold tracking-widest text-lg">
           
              </p>
            </div>
          );
        }

        // === 渲染至 DOM ===
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
